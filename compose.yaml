# 네 프로그램을 한 번에 띄우는 설정.
#   postgres  : 평가와 직무를 저장하는 DB
#   spring    : 화면이 부르는 API. AI 서버를 대신 호출한다.
#   fastapi   : 점수 계산과 설명 문장. 주소는 컨테이너 안에서 fastapi:8000
#   frontend  : 빌드된 화면. Nginx가 80번 포트로 열고 /api 는 Spring으로 넘긴다.
# 비밀번호는 환경변수 IF_DB_PASSWORD. 없으면 postgres와 spring이 시작을 거부한다.
name: if-app-stack

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: if_spring
      POSTGRES_USER: if_user
      POSTGRES_PASSWORD: ${IF_DB_PASSWORD:?IF_DB_PASSWORD_not_set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U if_user -d if_spring"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  spring:
    image: if-spring:local
    build:
      context: ./spring
    # 127.0.0.1만 연다. 같은 컴퓨터에서만 Spring에 직접 접속할 수 있다.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/if_spring
      SPRING_DATASOURCE_USERNAME: if_user
      SPRING_DATASOURCE_PASSWORD: ${IF_DB_PASSWORD:?IF_DB_PASSWORD_not_set}
      # 새 DB에서도 테이블을 자동으로 만든다. (있으면 그대로 사용)
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # 컨테이너끼리의 이름. localhost가 아니라 fastapi 라는 서비스 이름으로 찾는다.
      APP_AI_BASE_URL: http://fastapi:8000
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:8089,http://127.0.0.1:8089,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  fastapi:
    image: if-fastapi:local
    build:
      context: ./ai
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    restart: unless-stopped

  frontend:
    image: if-frontend:local
    build:
      context: ./web-vite
    # 브라우저가 여는 주소. 이 포트의 Nginx가 화면 파일과 /api 요청을 나눈다.
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres-data:
