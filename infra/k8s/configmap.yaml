apiVersion: v1
kind: ConfigMap
metadata:
  name: if-config
  namespace: if-v2
data:
  POSTGRES_DB: if_spring
  POSTGRES_USER: if_user
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/if_spring
  SPRING_DATASOURCE_USERNAME: if_user
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  APP_AI_BASE_URL: http://fastapi:8000
  APP_CORS_ALLOWED_ORIGINS: http://localhost
  GEMINI_MODEL: gemini-2.5-flash
