# 테스트 전용 설정. 실제 PostgreSQL 대신 메모리 DB(H2)를 쓰고, 끝나면 지운다.
# AI 주소는 일부러 닫힌 포트(9)다. AI를 가짜로 대체하지 않은 호출은 실패해야 한다.
spring:
  datasource:
    url: jdbc:h2:mem:if_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  ai:
    base-url: http://localhost:9
