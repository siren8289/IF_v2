# 로컬 기본값. Docker에서는 compose.yaml의 환경변수가 이 값을 덮어쓴다.
app:
  ai:
    base-url: http://localhost:8000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/if_spring
    username: if_user
    password: change-me
  jpa:
    hibernate:
      ddl-auto: validate   # DB 테이블은 만들지 않고, 엔티티와 맞는지만 확인한다.
    open-in-view: false
