spring:
  datasource:
    url: jdbc:h2:mem:if_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

app:
  ai:
    base-url: http://localhost:9

logging:
  level:
    org.hibernate.stat: info
