openapi: 3.0.3
info:
  title: IF Risk Assessment API
  description: |
    고령자 노동·돌봄 판단 시스템 Backend API (BE.md).
    성공 응답은 DTO/Page 직접 반환. 오류는 ApiResponse + errorCode.
  version: 0.2.0

servers:
  - url: http://localhost:8080
    description: Local Server

tags:
  - name: Applicant
  - name: Job
  - name: Assessment

paths:
  /api/applicants:
    get:
      tags: [Applicant]
      summary: 신청자 목록
      operationId: listApplicants
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicantResponse"
    post:
      tags: [Applicant]
      summary: 신청자 생성 (API-001)
      operationId: createApplicant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResponse"

  /api/applicants/{id}:
    get:
      tags: [Applicant]
      summary: 신청자 단건
      operationId: getApplicant
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/applicants/{id}/health-snapshots:
    post:
      tags: [Applicant]
      summary: 건강 스냅샷 생성 (API-002)
      operationId: createHealthSnapshot
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthSnapshotCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/applicants/{applicantId}/assessments:
    get:
      tags: [Assessment]
      summary: 신청자별 평가 목록
      operationId: listAssessmentsByApplicant
      parameters:
        - name: applicantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentResponse"
    post:
      tags: [Assessment]
      summary: 평가 생성 (API-003) — status=PENDING_AI
      operationId: createAssessment
      parameters:
        - name: applicantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/jobs:
    get:
      tags: [Job]
      summary: 직무 목록 (API-004)
      operationId: listJobs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobResponse"

  /api/assessments:
    get:
      tags: [Assessment]
      summary: 평가 목록 (API-008) — page, assessedAt DESC, id DESC
      operationId: listAllAssessments
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
        - name: sort
          in: query
          schema:
            type: array
            items:
              type: string
            default: [assessedAt,desc, id,desc]
      responses:
        "200":
          description: Spring Data Page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentRecordPage"

  /api/assessments/summary:
    get:
      tags: [Assessment]
      summary: 대시보드 집계
      operationId: getAssessmentSummary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSummaryResponse"

  /api/assessments/{assessmentId}/compute-risk:
    post:
      tags: [Assessment]
      summary: 위험도 산출 (API-005) — score 필수, explain fallback
      operationId: computeRisk
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
      responses:
        "204":
          description: Score 저장 및 AI_COMPLETED 전이
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/AiUnavailable"
        "504":
          $ref: "#/components/responses/AiTimeout"

  /api/assessments/{assessmentId}/risk-detail:
    get:
      tags: [Assessment]
      summary: 위험 상세 (API-006)
      operationId: getRiskDetail
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentRiskDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assessments/{assessmentId}:
    patch:
      tags: [Assessment]
      summary: 상태 변경 (API-007) — AI_COMPLETED→FINALIZED 등 허용 전이만
      operationId: updateAssessment
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentUpdateRequest"
      responses:
        "204":
          description: Updated
        "400":
          description: INVALID_REQUEST / INVALID_STATUS_TRANSITION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Assessment]
      summary: 평가 삭제 (API-009)
      operationId: deleteAssessment
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    ApplicantId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    AiUnavailable:
      description: AI_SERVICE_UNAVAILABLE
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    AiTimeout:
      description: AI_SERVICE_TIMEOUT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

  schemas:
    ApplicantCreateRequest:
      type: object
      required: [displayName, age]
      properties:
        displayName:
          type: string
          example: 이OO
        age:
          type: integer
          example: 68

    ApplicantResponse:
      type: object
      required: [id, displayName, age, createdAt]
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
        age:
          type: integer
        createdAt:
          type: string
          format: date-time

    HealthSnapshotCreateRequest:
      type: object
      properties:
        physicalLevel:
          type: integer
          minimum: 1
          maximum: 5
        chronicDiseaseFlag:
          type: boolean
        workHourLimit:
          type: integer

    HealthSnapshotResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        applicantId:
          type: integer
          format: int64
        physicalLevel:
          type: integer
        chronicDiseaseFlag:
          type: boolean
        workHourLimit:
          type: integer
        createdAt:
          type: string
          format: date-time

    JobResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        jobTitle:
          type: string
        workplace:
          type: string
        workHours:
          type: string
        description:
          type: string

    AssessmentCreateRequest:
      type: object
      required: [jobId, healthId]
      properties:
        jobId:
          type: integer
          format: int64
        healthId:
          type: integer
          format: int64

    AssessmentResponse:
      type: object
      required: [id, status, assessedAt]
      properties:
        id:
          type: integer
          format: int64
        applicantId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/AssessmentStatus"
        assessedAt:
          type: string
          format: date-time

    AssessmentStatus:
      type: string
      enum: [PENDING_AI, AI_COMPLETED, FINALIZED]
      description: |
        허용 전이: PENDING_AI→AI_COMPLETED, AI_COMPLETED→FINALIZED

    AssessmentUpdateRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AssessmentStatus"

    AssessmentRecordResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        applicantName:
          type: string
        age:
          type: integer
        jobTitle:
          type: string
        physicalLevel:
          type: integer
        status:
          $ref: "#/components/schemas/AssessmentStatus"
        totalRiskPercent:
          type: integer
        riskGrade:
          type: string
          enum: [LOW, MID, HIGH]
        assessedAt:
          type: string
          format: date-time

    AssessmentRecordPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentRecordResponse"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    AssessmentSummaryResponse:
      type: object
      properties:
        totalCount:
          type: integer
          format: int64
        highRiskCount:
          type: integer
          format: int64
        finalizedCount:
          type: integer
          format: int64

    AssessmentRiskDetailResponse:
      type: object
      properties:
        riskScore:
          type: integer
        riskGrade:
          type: string
        riskBand:
          type: string
        summary:
          type: string
        guidance:
          type: string
        disclaimer:
          type: string
        factorSummaries:
          type: array
          items:
            type: string

    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
        message:
          type: string
        errorCode:
          type: string
          enum:
            - INVALID_REQUEST
            - INVALID_STATUS_TRANSITION
            - NOT_FOUND
            - AI_SERVICE_UNAVAILABLE
            - AI_SERVICE_TIMEOUT
            - INTERNAL_ERROR
