name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-spring:
    name: Backend (Spring)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build test

  web-vite:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-vite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-vite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build


  data-pipeline:
    name: Data pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: data/requirements.txt
      - name: Install dependencies
        run: pip install -r data/requirements.txt
      - name: Test ingestion, processing and quality
        run: python -m unittest discover -s data/tests -v
