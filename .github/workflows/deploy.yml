
name: CD - Deploy IF_v2 to If_v3 EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: if-v3-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: i-0b400ab5f6fa756af

jobs:
  deploy:
    name: Deploy to If_v3
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify SSM connection
        run: |
          set -euo pipefail

          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)

          echo "SSM status: $STATUS"
          test "$STATUS" = "Online"

      - name: Send deployment command
        id: deploy
        run: |
          set -euo pipefail

          cat > command.json <<'JSON'
          {
            "commands": [
              "set -eu",
              "cd /home/ubuntu/IF_v2",
              "runuser -u ubuntu -- git fetch origin main",
              "runuser -u ubuntu -- git checkout main",
              "runuser -u ubuntu -- git merge --ff-only origin/main",
              "bash scripts/deploy.sh"
            ],
            "executionTimeout": ["2400"]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "IF_v3 deployment preflight" \
            --parameters file://command.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $COMMAND_ID"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          # 빌드가 몇 분 걸려서 기본 waiter(약 100초) 대신 직접 기다린다.
          STATUS=Pending
          for i in $(seq 1 160); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 15 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' \
            --output text

          echo "SSM status: $STATUS"
          test "$STATUS" = "Success"
