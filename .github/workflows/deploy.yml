name: Deploy IF_v2 to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: if-v2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "${SSH_HOST:-}" || {
            echo "::error::EC2_HOST secret is missing. Add repo secret EC2_HOST (EC2 public IP or DNS)."
            exit 1
          }

          test -n "${SSH_USER:-}" || {
            echo "::error::EC2_USER secret is missing. Add repo secret EC2_USER (usually ubuntu)."
            exit 1
          }

          test -n "${SSH_KEY:-}" || {
            echo "::error::EC2_SSH_KEY secret is missing. Add the EC2 private key (BEGIN ... PRIVATE KEY)."
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ["SSH_KEY"].strip()
          # GitHub secrets sometimes store literal \n instead of real newlines.
          if "BEGIN" in raw and raw.count("\n") < 2 and "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          raw = raw.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"

          path = Path.home() / ".ssh" / "deploy_key"
          path.write_text(raw)
          path.chmod(0o600)

          upper = raw.upper()
          if "PRIVATE KEY" not in upper:
              raise SystemExit(
                  "EC2_SSH_KEY does not look like a private key. "
                  "Paste the full PEM/OpenSSH private key including "
                  "-----BEGIN ... PRIVATE KEY----- lines."
              )
          if "PUBLIC KEY" in upper and "PRIVATE KEY" not in upper:
              raise SystemExit(
                  "EC2_SSH_KEY looks like a public key. Use the private key instead."
              )

          print(f"SSH key written ({path.stat().st_size} bytes).")
          PY

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>~/ssh-keygen.err; then
            echo "::error::EC2_SSH_KEY is present but not a valid private key."
            echo "ssh-keygen said:"
            sed 's|/home/runner/.ssh/deploy_key|deploy_key|g' ~/ssh-keygen.err || true
            echo "Fix: Settings → Secrets → EC2_SSH_KEY = full private key from the .pem file."
            exit 1
          fi

          echo "SSH key verified."

          if ! timeout 15 bash -c 'echo > /dev/tcp/"$1"/22' _ "$SSH_HOST"; then
            echo "::error::EC2 SSH port 22 is unreachable from GitHub Actions (host=${SSH_HOST})."
            echo "Check: EC2 is running, public IP/DNS is correct, and Security Group allows inbound TCP 22 from 0.0.0.0/0 (or GitHub Actions IP ranges)."
            exit 1
          fi

          echo "SSH port 22 reachable."

          ssh-keyscan -T 10 -H "$SSH_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH connection successful"'

      - name: Deploy Docker Compose
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'EOF'
          set -euo pipefail

          cd /home/ubuntu/IF_v2

          echo "=== Update Git ==="
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

          echo "=== Ensure swap (t3.small) ==="
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

          echo "=== Validate Compose ==="
          docker compose -f compose.yaml config --quiet

          echo "=== Free RAM before build ==="
          docker compose -f compose.yaml stop \
            spring fastapi frontend || true

          echo "=== Build sequentially ==="
          export COMPOSE_PARALLEL_LIMIT=1
          docker compose -f compose.yaml build frontend
          docker compose -f compose.yaml build spring
          docker compose -f compose.yaml build fastapi

          echo "=== Deploy ==="
          docker compose -f compose.yaml up \
            -d --no-deps --force-recreate \
            spring fastapi frontend

          echo "=== Status ==="
          docker compose -f compose.yaml ps

          wait_http() {
            local url="$1"
            local name="$2"
            local i
            for i in $(seq 1 40); do
              if curl -fsS --connect-timeout 2 --max-time 5 \
                "$url" > /dev/null 2>&1; then
                echo "$name ready (attempt $i)"
                return 0
              fi
              sleep 3
            done
            echo "::error::$name failed health check: $url"
            docker compose -f compose.yaml logs --tail=80 \
              spring fastapi frontend || true
            return 1
          }

          echo "=== FastAPI check ==="
          wait_http http://127.0.0.1:8000/openapi.json FastAPI

          echo "=== Spring check ==="
          wait_http \
            "http://127.0.0.1:8080/api/assessments?size=1" \
            Spring

          echo "DEPLOYMENT SUCCESS"
          EOF
