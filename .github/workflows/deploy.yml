name: Deploy IF_v2 to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: if-v2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$SSH_HOST" || {
            echo "::error::EC2_HOST is missing"
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "::error::EC2_USER is missing"
            exit 1
          }

          test -n "$SSH_KEY" || {
            echo "::error::EC2_SSH_KEY is missing"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          echo "SSH key verified."

          if ! timeout 15 bash -c \
            'echo > /dev/tcp/"$1"/22' _ "$SSH_HOST"; then
            echo "::error::EC2 SSH port 22 is unreachable"
            exit 1
          fi

          echo "SSH port 22 reachable."

          ssh-keyscan -T 10 -H "$SSH_HOST" \
            > ~/.ssh/known_hosts

          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH connection successful"'

      - name: Deploy Docker Compose
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'EOF'
          set -euo pipefail

          cd /home/ubuntu/IF_v2

          echo "=== Update Git ==="
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

          echo "=== Validate Compose ==="
          docker compose -f compose.yaml config --quiet

          echo "=== Build ==="
          docker compose -f compose.yaml build \
            spring fastapi frontend

          echo "=== Deploy ==="
          docker compose -f compose.yaml up \
            -d --no-deps --force-recreate \
            spring fastapi frontend

          echo "=== Status ==="
          docker compose -f compose.yaml ps

          echo "=== FastAPI check ==="
          curl -fsS --retry 10 --retry-delay 3 \
            --retry-connrefused \
            http://127.0.0.1:8000/openapi.json \
            > /dev/null

          echo "=== Spring check ==="
          curl -fsS --retry 10 --retry-delay 3 \
            --retry-connrefused \
            "http://127.0.0.1:8080/api/assessments?size=1" \
            > /dev/null

          echo "DEPLOYMENT SUCCESS"
          EOF
